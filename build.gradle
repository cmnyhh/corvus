// Corvus for Minecraft 1.20.1 (Forge 47.x). 1.20.1 predates NeoForge, so this is a separate toolchain.
plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '0.1.0'
group = 'dev.corvus'
base { archivesName = '渡鸦-随行无人机-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    // Curios is a mixin mod whose refmap is authored in SRG names. In a dev runtime the classes are
    // official names, so Mixin has to remap that refmap with the SRG->official mapping ForgeGradle
    // generates. Without these two properties Curios fails to apply AccessorEntity at boot.
    def mixinProps = [
            'mixin.env.remapRefMap'       : 'true',
            'mixin.env.refMapRemappingFile': "${buildDir}/createSrgToMcp/output.srg"
    ]
    runs {
        client {
            workingDirectory project.file('run')
            // Dev smoke harness switches; both default to off so a plain runClient is untouched.
            property 'corvus.smoke', (project.findProperty('corvusSmoke') ?: '0').toString()
            property 'corvus.gapsShot', (project.findProperty('corvusGapsShot') ?: '0').toString()
            property 'corvus.artifacts', project.file('artifacts/client').absolutePath
            mixinProps.each { key, value -> property key, value.toString() }
            if (project.hasProperty('corvusQuickPlay')) {
                args '--quickPlaySingleplayer', project.property('corvusQuickPlay').toString()
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'corvus.genworld', (project.findProperty('corvusGenWorld') ?: '0').toString()
            // Data/hardware acceptance run (see dev.corvus.devtools.HardwareSmoke).
            property 'corvus.hwtest', (project.findProperty('corvusHwtest') ?: '0').toString()
            property 'corvus.gaps', (project.findProperty('corvusGaps') ?: '0').toString()
            // TaCZ gun-backend acceptance run (see dev.corvus.devtools.TaczSmoke).
            property 'corvus.tacztest', (project.findProperty('corvusTacz') ?: '0').toString()
            mixinProps.each { key, value -> property key, value.toString() }
            args '--nogui'
            // Parallel agents share run-server; -PcorvusLevel=<name> runs the smoke against its own
            // world instead of fighting over the session lock of the shared one.
            if (project.hasProperty('corvusLevel')) {
                args '--world', project.property('corvusLevel').toString()
            }
            // The shared 25565 belongs to whichever harness is already running; a scoreboard run
            // never accepts connections, so it can pick its own port instead of failing to bind.
            if (project.hasProperty('corvusPort')) {
                args '--port', project.property('corvusPort').toString()
            }
        }
    }
}
repositories {
    mavenCentral()
    // TaCZ ships no maven artifact this build can reach. fg.deobf cannot remap a files(...) dependency
    // (ForgeGradle warns and keeps the obfuscated jar), so the staged jar is exposed as a flatDir module
    // and declared by coordinate: the file name must stay tacz-1.20.1-1.1.8.jar. -PtaczDir=<dir> points
    // the build at another copy.
    flatDir { dirs file(project.findProperty('taczDir') ?: "${rootDir}/../.dronepal-gradle/tacz-1.20.1") }
    // Curios 5.x (1.20.1) is published only by its author's maven. A plain maven block (not
    // exclusiveContent): fg.deobf resolves the remapped artifact through ForgeGradle's own
    // generated repository, which exclusiveContent would hide for this group.
    maven {
        name = 'IllusiveNetworks'
        url = 'https://maven.theillusivec4.top/'
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    // The api classifier is mojmap-compiled, so it compiles without deobf; the runtime jar must be
    // deobfuscated like any other 1.20.1 mod jar. Neither is bundled into our jar.
    compileOnly 'top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api'
    runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')

    // TaCZ 1.1.8+ (1.20.1 Forge), resolved from the flatDir repository declared above:
    //   compileOnly: TaCZ's own classes and its api package are mojmap-compiled, so no deobf is needed
    //                to compile against them. Every call site sits behind ModList/instanceof guards,
    //                so the mod stays optional (see CombatSlots).
    //   runtimeOnly:  the released jar still carries SRG references (it is a production mod jar), so
    //                the dev runtime only sees working method names after fg.deobf — which writes the
    //                remapped copy to caches/forge_gradle/deobf_dependencies/tacz/... and remaps the
    //                mixin refmap through the two mixin properties below (same as Curios).
    compileOnly group: 'tacz', name: 'tacz-1.20.1', version: '1.1.8'
    runtimeOnly fg.deobf(group: 'tacz', name: 'tacz-1.20.1', version: '1.1.8')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// ---- Mixin wiring (dev.corvus.mixin) -----------------------------------------------------------
// Forge 1.20.1 learns about mixin configurations from the manifest attribute "MixinConfigs"
// (org.spongepowered.asm.launch.platform.MixinPlatformAgentDefault#prepare -> MixinPlatformManager
// #addConfig), NOT from mods.toml: [[mixins]] is the NeoForge 1.20.2+ spelling and FML 47 has no
// parser for it (ModFileParser/ModInfo only read mods, dependencies, modproperties, features).
// Mixin reads that attribute from a jar *and* from a classpath directory (MainAttributes
// #getDirAttributes), so the same one-line attribute is written twice: the real jar manifest below,
// and build/resources/main/META-INF/MANIFEST.MF, because a dev run's copy of the mod is just the
// exploded source set and has no manifest of its own.
def mixinConfigs = 'corvus.tacz.mixins.json'

tasks.named('processResources', ProcessResources).configure {
    // Dev-only manifest: Mixin's container for a classpath directory is read from this file.
    def outDir = destinationDir
    doLast {
        File metaInf = new File(outDir, 'META-INF')
        metaInf.mkdirs()
        new File(metaInf, 'MANIFEST.MF').setText(
                "Manifest-Version: 1.0\r\nMixinConfigs: ${mixinConfigs}\r\n\r\n", 'UTF-8')
    }
}

jar {
    // ... and it must not land next to the archive's real manifest.
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes('MixinConfigs': mixinConfigs)
    }
}
