plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.dronepal'
version = '0.2.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.267'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { huhu_dronepal { sourceSet sourceSets.main } }
}
if (providers.gradleProperty('curiosGameTest').isPresent()) apply from: 'gradle/curios-gametest.gradle'


tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { archiveFileName = "渡鸦-随行无人机-${version}.jar" }
repositories {
    // Offline-friendly: the JUnit 5 jars used by corvus-core's parity table are already in ~/.m2.
    // No runtime artifact of the mod comes from here.
    mavenLocal()
    exclusiveContent {
        forRepository { maven { url = 'https://maven.theillusivec4.top' } }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
}
apply from: 'gradle/tacz.gradle'
apply from: 'gradle/ftb-teams.gradle'
apply from: 'gradle/patchouli.gradle'
dependencies {
    implementation 'top.theillusivec4.curios:curios-neoforge:9.2.2+1.21.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.joml:joml:1.10.5'
    testImplementation 'com.mojang:brigadier:1.3.10'
    // corvus-core/src/test: plain JUnit 5, no Minecraft (same table the 1.20.1 build runs).
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.5'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.5'
}
tasks.named('test') { useJUnitPlatform() }
tasks.register('checkDroneMesh', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.dronepal.client.DroneMeshCheck'
}
tasks.register('checkCuriosContract', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'dev.dronepal.CuriosContractCheck'
}
tasks.register('checkDialogue', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'dev.dronepal.DialogueCheck'
}
tasks.named('check') { dependsOn 'checkDroneMesh', 'checkCuriosContract', 'checkDialogue' }

// Corvus shared core: one copy of the cross-version rules, compiled into both loaders.
// The shared core lives next to the two projects in the dev workspace, but inside the
// repository on CI (where each branch root is the project itself). Accept both layouts.
def coreSrc = { String sub ->
    def sibling = file("../corvus-core/${sub}")
    sibling.exists() ? sibling : file("corvus-core/${sub}")
}
sourceSets {
    main {
        java.srcDir coreSrc('src/main/java')
    }
    test {
        java.srcDir coreSrc('src/test/java')
    }
}
