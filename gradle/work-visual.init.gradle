// Isolated client that photographs the three phases of the drone's work cycle over the ore mill.
// Reuses the project's dev game directory (its own "New World" save and options.txt lang:zh_cn) so the
// world is the one the rest of the 1.21.1 client art was captured in.
// gradlew -I gradle/work-visual.init.gradle runWorkVisual
allprojects { p -> p.afterEvaluate {
    if (!p.plugins.hasPlugin('net.neoforged.moddev')) return
    def source = p.sourceSets.create('workVisual') {
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
    p.neoForge.mods.huhu_dronepal.sourceSet(source)
    p.neoForge.runs.create('workVisual') {
        client()
        sourceSet = source
        gameDirectory = p.layout.projectDirectory.dir('run')   // the healthy 1.21.1 dev world
        programArguments.addAll('--width','1280','--height','800','--quickPlaySingleplayer','New World')
        systemProperty 'dronepal.work.dir', p.layout.projectDirectory.dir('artifacts/client').asFile.absolutePath
    }
} }
