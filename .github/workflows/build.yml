name: build-1.21.1
on:
  push:
    branches: [1.21.1]
  pull_request:
    branches: [1.21.1]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (NeoForge 1.21.1)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Normalise the download name to ASCII
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/corvus-1.21.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: corvus-1.21.1
          path: dist/*.jar
          if-no-files-found: error
      - name: Publish jar as a release asset (keeps the .jar extension)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-latest
          name: "${{ github.ref_name }} latest build"
          body: "Automatically built from the ${{ github.ref_name }} branch."
          prerelease: true
          files: dist/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
